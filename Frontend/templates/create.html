{% extends "base.html" %}
{% block title %}Create Ticket — Support Ticketing CRM{% endblock %}
{% block content %}
<div class="max-w-xl space-y-6">
  <div>
    <h1 class="text-2xl font-semibold">Create Ticket</h1>
    <p class="text-slate-500 text-sm mt-1">Submit a new customer support request.</p>
  </div>

  <div id="error" class="hidden rounded-md bg-red-50 text-red-700 px-4 py-3 text-sm"></div>
  <div id="success" class="hidden rounded-md bg-green-50 text-green-700 px-4 py-3 text-sm"></div>

  <form id="create-form" class="bg-white border border-slate-200 rounded-lg p-6 space-y-4">
    <div>
      <label for="customer_name" class="block text-sm font-medium mb-1">Customer name</label>
      <input id="customer_name" name="customer_name" required
        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
    </div>
    <div>
      <label for="customer_email" class="block text-sm font-medium mb-1">Customer email</label>
      <input id="customer_email" name="customer_email" type="email" required
        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
    </div>
    <div>
      <label for="subject" class="block text-sm font-medium mb-1">Issue title</label>
      <input id="subject" name="subject" required
        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
    </div>
    <div>
      <label for="description" class="block text-sm font-medium mb-1">Description</label>
      <textarea id="description" name="description" rows="5" required
        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"></textarea>
    </div>
    <div class="flex items-center gap-3 pt-2">
      <button type="submit"
        class="bg-slate-800 text-white px-4 py-2 rounded-md text-sm hover:bg-slate-700">
        Create ticket
      </button>
      <a href="/" class="text-sm text-slate-600 hover:text-slate-900">Cancel</a>
    </div>
  </form>
</div>

<script src="/static/js/app.js"></script>
<script>
  initCreateForm();
</script>
{% endblock %}
