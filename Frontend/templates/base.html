<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Support Ticketing CRM{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
      <a href="/" class="text-lg font-semibold text-slate-800">Support Ticketing CRM</a>
      <nav class="flex items-center gap-3 text-sm">
        <a href="/" class="text-slate-600 hover:text-slate-900">All Tickets</a>
        <a href="/tickets/new" class="bg-slate-800 text-white px-3 py-2 rounded-md hover:bg-slate-700">
          New Ticket
        </a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
