{% extends "base.html" %}
{% block title %}All Tickets — Support Ticketing CRM{% endblock %}
{% block content %}
<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold">All Tickets</h1>
      <p class="text-slate-500 text-sm mt-1">Search and filter customer support tickets.</p>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
    <div class="sm:col-span-2">
      <label for="search" class="block text-sm font-medium text-slate-700 mb-1">Search</label>
      <input
        id="search"
        type="search"
        placeholder="Search by name, ID, email, or description..."
        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"
      />
    </div>
    <div>
      <label for="status-filter" class="block text-sm font-medium text-slate-700 mb-1">Status</label>
      <select
        id="status-filter"
        class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"
      >
        <option value="">All statuses</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
      </select>
    </div>
  </div>

  <div id="error" class="hidden rounded-md bg-red-50 text-red-700 px-4 py-3 text-sm"></div>

  <div class="overflow-x-auto bg-white border border-slate-200 rounded-lg">
    <table class="min-w-full text-sm">
      <thead class="bg-slate-100 text-left text-slate-600">
        <tr>
          <th class="px-4 py-3 font-medium">ID</th>
          <th class="px-4 py-3 font-medium">Name</th>
          <th class="px-4 py-3 font-medium">Title</th>
          <th class="px-4 py-3 font-medium">Status</th>
          <th class="px-4 py-3 font-medium">Date</th>
        </tr>
      </thead>
      <tbody id="tickets-body" class="divide-y divide-slate-100">
        <tr>
          <td colspan="5" class="px-4 py-8 text-center text-slate-500">Loading tickets...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
  initTicketList();
</script>
{% endblock %}
